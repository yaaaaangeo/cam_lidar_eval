name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run test suite
        run: |
          chmod +x run_tests.sh
          ./run_tests.sh

      - name: Smoke test CLI (demo mode)
        run: |
          python -m app.cli --demo --demo-frames 20 --output-dir /tmp/ci_demo --no-visuals
          test -f /tmp/ci_demo/report.json
          test -f /tmp/ci_demo/report.html

      - name: Smoke test installed console script
        run: |
          cam-lidar-eval --demo --demo-frames 20 --output-dir /tmp/ci_demo_entrypoint --no-visuals
