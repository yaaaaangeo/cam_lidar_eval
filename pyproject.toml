[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cam-lidar-eval"
version = "0.1.0"
description = "GT-free quality evaluation for an existing camera-LiDAR extrinsic calibration"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Cam-LiDAR Eval contributors" },
]
keywords = [
    "camera-lidar-calibration",
    "extrinsic-calibration",
    "sensor-fusion",
    "point-cloud",
    "autonomous-driving",
    "robotics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Processing",
]

dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",  # optional: every test file also runs standalone with `python3 tests/test_X.py`
    "ruff>=0.6",    # lint (see [tool.ruff] below): `ruff check .`
]
rosbag = [
    "rosbags>=0.10",        # pure-Python rosbag1/rosbag2 reader -- no ROS/rclpy install needed
    "rosbags-image>=0.10",  # ROS Image/CompressedImage -> OpenCV conversion
]

[project.urls]
Homepage = "https://github.com/yaaaaangeo/cam_lidar_eval"
Issues = "https://github.com/yaaaaangeo/cam_lidar_eval/issues"

[project.scripts]
cam-lidar-eval = "app.cli:main"

# This repo intentionally uses a flat, multi-top-level-package layout
# (input/, geometry/, evaluation/, quality/, visualization/, report/, app/)
# rather than a single nested namespace package, matching how the modules
# already import each other (e.g. `from input.camera import ...`). Listing
# them explicitly avoids setuptools' auto-discovery pulling in tests/.
[tool.setuptools]
packages = [
    "app",
    "evaluation",
    "geometry",
    "input",
    "quality",
    "report",
    "visualization",
]

# Deliberately scoped to just the pyflakes-equivalent rule set (F: unused
# imports/names, undefined names, etc.) -- the kind of real, low-noise bug
# this project has caught by hand a few times already (e.g. stale imports
# left behind after a refactor). Broader style rule sets (import sorting,
# `Optional[X]` -> `X | None` modernization, line length, etc.) are
# intentionally NOT enabled: they'd fire ~175 times against this codebase's
# existing, consistent conventions and turn CI lint output into noise
# nobody reads, rather than a small number of things actually worth fixing.
[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["F"]
